<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridlington Gold Radio</title>

    <!-- App Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- App Icons (Updated to lowercase to match GitHub) -->
    <link rel="icon" href="assets/bgr-logo.png" type="image/png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Theme + Description -->
    <meta name="theme-color" content="#d4af37">
    <meta name="description" content="Bridlington Gold Radio – The Music You Love">

    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="BGR">

    <!-- iOS Icons + Splash (Updated to lowercase to match GitHub) -->
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="apple-touch-startup-image" href="assets/icon-512.png">
</head>

<body>

    <header class="app-header">
        <!-- Logo file path updated to lowercase bgr-logo.png -->
        <img src="assets/bgr-logo.png" alt="Bridlington Gold Radio Logo" class="logo">
        <h1>Bridlington Gold Radio</h1>
        <p class="tagline">The Music You Love</p>
    </header>

    <nav class="main-menu">
        <button class="menu-button" id="menuToggle">☰ Menu</button>
        <ul id="menuList" class="menu-list hidden">
            <li><a href="index.html">Home</a></li>
            <li><a href="schedule.html">Schedule</a></li>
            <li><a href="https://www.bridlingtongoldradio.co.uk" target="_blank">Visit Website</a></li>
        </ul>
    </nav>

    <section class="wave-section">
        <div class="now-playing-box">
            <h2>Now Playing</h2>
            <p id="track-title">Loading...</p>
            <p id="track-artist"></p>
        </div>

        <button class="primary-button" id="playButton">Listen Live</button>

        <button id="installButton" style="display:none;" class="primary-button">
            Install Our App
        </button>

        <audio id="radioPlayer" src="https://bridgold.radioca.st/stream?type=.mp3"></audio>
        <p id="statusText" class="status-text">Ready to play.</p>
    </section>

    <!-- ⭐ NOW ON AIR SECTION -->
    <section class="now-on-air">
        <h2>Now On Air</h2>
        <img id="now-on-air-photo" class="now-on-air-photo" src="" alt="Presenter Photo">
        <div id="now-on-air-box">Loading…</div>
    </section>

    <section class="today-shows">
        <!-- Text color locked to pure black hex code -->
        <h2 style="color: #000000;">Today’s Shows</h2>
        <div id="todays-shows"></div>
    </section>

    <footer class="app-footer">
        <p>© Bridlington Gold Radio</p>
        <p class="footer-links">
            <a href="privacy.html">Privacy Policy</a> ·
            <a href="legal.html">Legal Terms</a> ·
            <a href="contact.html">Contact Us</a>
        </p>
    </footer>

    <script src="js/app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>

</body>
</html>
